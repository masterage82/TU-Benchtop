<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ytong Shed &amp; Carport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink:   #e9f1ef;
    --dim:   rgba(233, 241, 239, 0.58);
    --amber: #ffb45c;              /* annunciator, active controls, dimension lines */
    --live:  #6fe3a3;
    --rule:  rgba(233, 241, 239, 0.26);
    --track: rgba(233, 241, 239, 0.20);
    --smoke: 8, 20, 14;            /* scrim base, biased to the garden's deep green */
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1a12; }
  body { font-family: "Barlow Condensed", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }

  /* Overlays are scrims over the render, not cards on top of it. */
  .scrim { position: fixed; pointer-events: none; user-select: none; }

  #hud {
    top: 0; left: 0; padding: 20px 76px 44px 24px;
    background: linear-gradient(148deg, rgba(var(--smoke), 0.62) 0%, rgba(var(--smoke), 0.34) 44%, rgba(var(--smoke), 0) 76%);
  }
  #annun { display: flex; align-items: center; gap: 9px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }
  #dot.off { background: rgba(233, 241, 239, 0.28); box-shadow: none; }
  #phase {
    font-size: 27px; font-weight: 600; line-height: 1;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--amber);
  }
  #sub {
    margin-top: 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--dim);
  }
  /* The spec block is content: real numbers the study is about. */
  #tele {
    margin-top: 13px; display: grid; grid-template-columns: auto auto auto; gap: 3px 10px;
    border-left: 1px solid var(--rule); padding-left: 11px;
  }
  #tele .k {
    font-size: 11px; font-weight: 500; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--dim); align-self: center;
  }
  #tele .v {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
    text-align: right; line-height: 1.35; white-space: nowrap;
  }
  #tele .u { font-size: 11px; letter-spacing: 0.08em; color: var(--dim); align-self: center; }

  #bar {
    left: 0; right: 0; bottom: 0; padding: 40px 24px 15px;
    background: linear-gradient(to top, rgba(var(--smoke), 0.5), rgba(var(--smoke), 0) 100%);
    display: flex; align-items: flex-end; gap: 22px;
  }
  #ctl { display: flex; gap: 8px; flex-wrap: wrap; pointer-events: auto; }
  .btn {
    pointer-events: auto; appearance: none; -webkit-appearance: none;
    background: rgba(var(--smoke), 0.38); border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink); font-family: inherit; font-size: 11px; font-weight: 500; line-height: 1;
    letter-spacing: 0.15em; text-transform: uppercase; padding: 9px 12px; cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.on { color: var(--amber); border-color: var(--amber); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .btn .val {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.04em; text-transform: none; color: var(--amber); margin-left: 8px;
  }
  #hint {
    margin-left: auto; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim); white-space: nowrap; transition: color 0.5s;
  }
  #hint.manual { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) { .btn, #hint { transition: none; } }
  @media (max-width: 560px) {
    #hud { padding-right: 24px; }
    #phase { font-size: 21px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="scrim">
  <div id="annun"><span id="dot"></span><span id="phase">Shed + Carport</span></div>
  <div id="sub">Ytong &middot; rendered &middot; one RC slab</div>
  <div id="tele"></div>
</div>
<div id="bar" class="scrim">
  <div id="ctl">
    <button id="bDim" class="btn" type="button" aria-pressed="false">Dimensions</button>
    <button id="bSun" class="btn" type="button">Sun<span class="val" id="sunVal">Noon</span></button>
    <button id="bGhost" class="btn" type="button" aria-pressed="false">Ghost slab</button>
    <button id="bExpl" class="btn" type="button" aria-pressed="false">Exploded</button>
    <button id="bBuild" class="btn" type="button">Build<span class="val" id="buildVal"></span></button>
  </div>
  <div id="hint">Drag to orbit &middot; Scroll to zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script>
(function () {
'use strict';

/* ---------------------------------------------------------------------------
 * DIMENSIONS (metres, 1 world unit = 1 m). Every piece of geometry derives
 * from these constants; change them here and the building, the dimension
 * lines and the HUD spec block all follow.
 * ------------------------------------------------------------------------- */
const SHED_W    = 4.00;   // shed outer width (x)
const SHED_D    = 4.00;   // shed outer depth (z); the carport shares this depth
const WALL_H    = 3.00;   // finished floor to slab underside
const WALL_T    = 0.30;   // Ytong wall thickness (300 mm blocks, thin-bed joints)
const CARPORT_W = 4.00;   // carport clear width (x): shared wall face to column outer face
const COL       = 0.36;   // column section, square, Ytong (rendered like the walls)
const SLAB_T    = 0.20;   // reinforced concrete slab thickness
const OVERHANG  = 0.30;   // slab overhang beyond wall / column outer faces, all round
const SLAB_FALL = 0.04;   // extra top-surface height at the front edge: ~1:115 fall to the back
const CHAMFER   = 0.06;   // drip-edge chamfer on the underside of the overhang
const PLINTH_H  = 0.30;   // darker plinth band at the foot of the render
const FLOOR_T   = 0.15;   // slab-on-grade thickness
const GROUND_Y  = -0.12;  // garden ground level; finished floor is y = 0
const PAVE_Y    = -0.06;  // top of paving (path / driveway)
const DOOR_W    = 1.00, DOOR_H = 2.10;   // both doors: one centred in the front wall, one in the back
const HUMAN_H   = 1.80;   // scale figure
const HIP_Y     = 1.00, SHOULDER_Y = 1.58, ARM_LEN = 0.66;   // the figure's working joints
const BLK_L     = 0.625, BLK_H = 0.25;   // Ytong block face: 625 long x 250 high; WALL_T deep. 3.00 / 0.25 = 12 courses
const LINTEL_H  = 0.25;   // reinforced Ytong lintel over each door opening
const LINTEL_B  = 0.20;   // its bearing on the blockwork either side of the opening
const MIN_PIECE = 0.10;   // shortest piece a course is cut into; a joint that would leave less is dropped

// Derived plan geometry
const CARPORT_D = SHED_D;
const X0 = -CARPORT_W, X1 = 0, X2 = SHED_W;        // carport X0..X1 (west), shed X1..X2 (east)
const Z0 = -SHED_D / 2, Z1 = SHED_D / 2;           // front (south) face at Z0, back at Z1
const SLAB_W = SHED_W + CARPORT_W + 2 * OVERHANG;  // 8.60
const SLAB_D = SHED_D + 2 * OVERHANG;              // 4.60
const SLAB_Y = WALL_H;                             // slab underside
const SLAB_TOP = SLAB_Y + SLAB_T;                  // slab top at the back edge (front is +SLAB_FALL)
const SHED_CX = (X1 + X2) / 2;                                     // +2.00, shed centre line
const DOOR_X0 = SHED_CX - DOOR_W / 2, DOOR_X1 = SHED_CX + DOOR_W / 2;   // 1.50 .. 2.50
const COL_Z = [Z0, Z1 - COL];                                      // z start of each column
const DOOR_OP = { a0: DOOR_X0, a1: DOOR_X1, y0: 0, y1: DOOR_H };   // door opening, in (run, height)
const LINTEL_OP = { a0: DOOR_X0 - LINTEL_B, a1: DOOR_X1 + LINTEL_B, y0: DOOR_H, y1: DOOR_H + LINTEL_H };
const DRIVE_Z = -9.5;                                              // driveway runs from here to the carport
const PATH_Z = -4.2;                                               // door path turns here

/* ---------------------------------------------------------------------------
 * Small math helpers
 * ------------------------------------------------------------------------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smoothstep = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
const damp = (lambda, dt) => 1 - Math.exp(-lambda * dt);

// Deterministic RNG (mulberry32) so the garden is identical on every load.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(2024);

// Value noise + fbm (non-tiling, for terrain and ground colour).
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += amp * vnoise(x * f, y * f); f *= 2.13; amp *= 0.5; }
  return s; // ~0..1, mean ~0.5
}
// Tiling variant: the lattice wraps at integer period P, so textures built from it are seamless.
function hashP(x, y, P, salt) { x = ((x % P) + P) % P; y = ((y % P) + P) % P; return hash2(x + salt * 17.3, y + salt * 5.1); }
function vnoiseP(x, y, P, salt) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hashP(xi, yi, P, salt), b = hashP(xi + 1, yi, P, salt), c = hashP(xi, yi + 1, P, salt), d = hashP(xi + 1, yi + 1, P, salt);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbmP(x, y, P, oct, salt) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoiseP(x * f, y * f, P * f, salt + i); f *= 2; amp *= 0.5; }
  return s;
}
// M x M grid of tiling fbm, sampled bilinearly (cheaper than per-pixel fbm on a 1k texture).
function tileNoise(M, P, oct, salt) {
  const a = new Float32Array(M * M);
  for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) a[y * M + x] = fbmP(x / M * P, y / M * P, P, oct, salt);
  return a;
}
function sampleTile(arr, M, u, v) {
  const x = u * M, y = v * M;
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const x0 = xi % M, x1 = (xi + 1) % M, y0 = yi % M, y1 = (yi + 1) % M;
  return lerp(lerp(arr[y0 * M + x0], arr[y0 * M + x1], fx), lerp(arr[y1 * M + x0], arr[y1 * M + x1], fx), fy);
}

/* ---------------------------------------------------------------------------
 * Renderer / scene / lights
 * ------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const FOG_COLOR = new THREE.Color(0xd9e7ec);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR, 45, 150);   // very light: only the far garden edge softens
renderer.setClearColor(FOG_COLOR);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);

const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Sun. Presets are cycled by the Sun button; the light tweens between them.
// Compass: +x = east, +z = north, so the shed's front (Z0) faces south.
const SUN_PRESETS = [
  { name: 'Morning',   dir: new THREE.Vector3(0.78, 0.50, -0.42), color: new THREE.Color(0xffe3bd), intensity: 2.5, hemi: 0.60, horizon: new THREE.Color(0xdfe6df) },
  // Noon is deliberately ~54 deg, not overhead: the slab's shadow then covers the back 2.4 m of the
  // carport floor and most of the shared wall with a diagonal edge, leaving a sunlit strip at the front.
  { name: 'Noon',      dir: new THREE.Vector3(0.30, 0.82, -0.52), color: new THREE.Color(0xfff4e6), intensity: 2.9, hemi: 0.70, horizon: new THREE.Color(0xd9e7ec) },
  { name: 'Afternoon', dir: new THREE.Vector3(-0.80, 0.42, -0.42), color: new THREE.Color(0xffcf9c), intensity: 2.2, hemi: 0.52, horizon: new THREE.Color(0xe9dccb) },
];
for (const p of SUN_PRESETS) p.dir.normalize();
let sunIdx = 1;   // opens on Noon: the deep slab shadow in the carport is the hero condition
const sunDir = SUN_PRESETS[sunIdx].dir.clone();
const SUN_TARGET = new THREE.Vector3(0, 1.5, 0);

const sun = new THREE.DirectionalLight(SUN_PRESETS[sunIdx].color, SUN_PRESETS[sunIdx].intensity);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
sun.target.position.copy(SUN_TARGET);
scene.add(sun);
scene.add(sun.target);
function placeSun() { sun.position.copy(SUN_TARGET).addScaledVector(sunDir, 30); }
placeSun();

// Hemisphere fill: sky blue from above, green bounce off the planting from below.
const hemi = new THREE.HemisphereLight(0xbfdcff, 0x4f7a36, SUN_PRESETS[sunIdx].hemi);
scene.add(hemi);

// Sky: inverted sphere with a procedural gradient + sun glow.
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uZenith: { value: new THREE.Color(0x3b86d8) },
    uHorizon: { value: FOG_COLOR.clone() },
    uBelow: { value: new THREE.Color(0x2f4a2a) },
    uSunDir: { value: sunDir.clone() },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uZenith, uHorizon, uBelow, uSunDir;
    varying vec3 vDir;
    void main() {
      float y = vDir.y;
      vec3 col = mix(uHorizon, uZenith, pow(smoothstep(0.0, 0.7, y), 0.6));
      col = mix(uBelow, col, smoothstep(-0.08, 0.0, y));
      float s = max(dot(vDir, uSunDir), 0.0);
      col += vec3(1.0, 0.9, 0.7) * (pow(s, 600.0) * 1.2 + pow(s, 12.0) * 0.12);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat));

/* ---------------------------------------------------------------------------
 * Canvas textures. Everything is generated at runtime; all of them tile.
 * ------------------------------------------------------------------------- */
function makeCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function tex(cv, srgb) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Tangent-space normal map from a wrapped height field (flipY canvas convention: +G = up in the image).
function normalFromHeight(H, S, k) {
  const cv = makeCanvas(S, S), g = cv.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) {
    const ym = (y - 1 + S) % S, yp = (y + 1) % S;
    for (let x = 0; x < S; x++) {
      const xm = (x - 1 + S) % S, xp = (x + 1) % S;
      const dx = H[y * S + xp] - H[y * S + xm], dy = H[yp * S + x] - H[ym * S + x];
      const nx = -dx * k, ny = dy * k, nz = 1;
      const l = Math.hypot(nx, ny, nz);
      const i = (y * S + x) * 4;
      d[i] = (nx / l * 0.5 + 0.5) * 255; d[i + 1] = (ny / l * 0.5 + 0.5) * 255; d[i + 2] = (nz / l * 0.5 + 0.5) * 255; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return cv;
}

// Exterior render (Rieselputz): fine aggregate grain, large-scale mottling, faint trowel sweeps.
// One tile = 2 m x 2 m at 1024 px, so a pixel is ~2 mm: one grain of aggregate.
function plasterMaps(seed, rgb, grainAmt, mottleAmt, bumpK) {
  const S = 1024, M = 128, r = mulberry32(seed);
  const mot = tileNoise(M, 5, 4, seed);
  // Trowel sweeps: wide, very faint arcs, drawn 9x so they wrap.
  const st = makeCanvas(S, S), sg = st.getContext('2d');
  sg.fillStyle = '#808080'; sg.fillRect(0, 0, S, S);
  sg.lineCap = 'round';
  for (let i = 0; i < 36; i++) {
    const cx = r() * S, cy = r() * S, rad = 120 + r() * 260, a0 = r() * 6.28, a1 = a0 + 0.8 + r() * 1.6;
    sg.lineWidth = 30 + r() * 70;
    sg.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      sg.beginPath(); sg.arc(cx + ox * S, cy + oy * S, rad, a0, a1); sg.stroke();
    }
  }
  const stData = sg.getImageData(0, 0, S, S).data;
  const half = S / 2, coarse = new Float32Array(half * half);
  for (let i = 0; i < coarse.length; i++) coarse[i] = r() - 0.5;
  const cv = makeCanvas(S, S), g = cv.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  const H = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x;
    const m = sampleTile(mot, M, x / S, y / S) - 0.5;
    const strokes = stData[i * 4] / 128 - 1;
    const fine = r() - 0.5, co = coarse[(y >> 1) * half + (x >> 1)];
    let gr = (0.55 * fine + 0.45 * co) * grainAmt;
    const sp = r();
    if (sp < 0.025) gr -= 0.10; else if (sp < 0.045) gr += 0.08;   // sparse darker / lighter aggregate
    const tone = 1 + m * mottleAmt * 2 + strokes * 0.6 + gr;
    d[i * 4] = clamp(rgb[0] * tone, 0, 255); d[i * 4 + 1] = clamp(rgb[1] * tone, 0, 255); d[i * 4 + 2] = clamp(rgb[2] * tone, 0, 255); d[i * 4 + 3] = 255;
    H[i] = 0.5 + gr * 2.2 * bumpK + m * 0.15;
  }
  g.putImageData(img, 0, 0);
  return { map: tex(cv, true), normalMap: tex(normalFromHeight(H, S, 2.0)) };
}

// Formed concrete: 0.5 x 2.0 m form-board panels with tone steps, thin joints, faint staining, bug holes.
// One tile = 4 m x 4 m.
function concreteMaps(seed) {
  const S = 1024, M = 128, r = mulberry32(seed);
  const mot = tileNoise(M, 4, 4, seed), stain = tileNoise(M, 3, 3, seed + 7);
  const PW = S / 8, PH = S / 2;
  const panel = [];
  for (let i = 0; i < 16; i++) panel.push((r() - 0.5) * 0.10);
  const cv = makeCanvas(S, S), g = cv.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  const H = new Float32Array(S * S);
  const base = [158, 156, 150], stainC = [120, 108, 90];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x;
    const m = sampleTile(mot, M, x / S, y / S) - 0.5;
    const st = Math.max(0, sampleTile(stain, M, x / S, y / S) - 0.55) * 2.2;
    const pi = Math.floor(y / PH) * 8 + Math.floor(x / PW);
    const joint = (x % PW < 2 || y % PH < 2) ? 1 : 0;
    const grain = (r() - 0.5) * 0.06;
    const tone = 1 + panel[pi] + m * 0.22 + grain - joint * 0.16;
    for (let k = 0; k < 3; k++) d[i * 4 + k] = clamp(lerp(base[k], stainC[k], st * 0.6) * tone, 0, 255);
    d[i * 4 + 3] = 255;
    H[i] = 0.5 + grain * 0.5 + m * 0.06 - joint * 0.25;
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = 'rgba(40,40,38,0.55)';
  for (let i = 0; i < 220; i++) { g.beginPath(); g.arc(r() * S, r() * S, 1 + r() * 2.5, 0, 6.2832); g.fill(); }
  return { map: tex(cv, true), normalMap: tex(normalFromHeight(H, S, 2.5)) };
}

// Concrete pavers 200 x 100 mm in stretcher bond. One tile = 1 m.
function paverMaps(seed) {
  const S = 512, r = mulberry32(seed), PW = S / 5, PH = S / 10;
  const cv = makeCanvas(S, S), g = cv.getContext('2d');
  g.fillStyle = '#6a665e'; g.fillRect(0, 0, S, S);
  for (let j = 0; j < 10; j++) {
    const off = (j % 2) * PW / 2;
    for (let i = -1; i < 5; i++) {

// Planar UVs from world position, chosen per face by dominant normal axis. Geometry must already be
// in world coordinates, so adjacent boxes share one continuous texture with no seams.
function planarUV(geo, tile) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv.setXY(i, u / tile, v / tile);

}

  const pos = new Float32Array(vCount * 3), nor = new Float32Array(vCount * 3), uv = new Float32Array(vCount * 2);
  const idx = vCount > 65535 ? new Uint32Array(iCount) : new Uint16Array(iCount);
  let vo = 0, io = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, vo * 3);
    nor.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    const gi = g.index.array;
    for (let k = 0; k < gi.length; k++) idx[io + k] = gi[k] + vo;
    vo += g.attributes.position.count; io += gi.length;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

 * The building

 * Ytong block, each lintel, each door part, the slabs, the fittings. Assembled

const EXPL_XZ = 0.70;            // radial spread per metre from the centre line
const EXPL_Y  = 0.90;            // lift per metre above the floor slab's underside
const EXPL_Y0 = -FLOOR_T;        // the pivot height: everything lifts away from here

                                 // four planes of blockwork separate instead of staying a box

// the opening they sit in (door leaves, fittings) rather than just drift with the wall.

    centre: new THREE.Vector3(cx, cy, cz),

// The roof: one monolithic slab over the whole footprint, with a drainage fall and a chamfered drip edge
// under the overhang. Built as three rings of corners: top, outer edge at chamfer height, chamfer foot.
function slabGeometry() {
  const x0 = X0 - OVERHANG, x1 = X2 + OVERHANG, z0 = Z0 - OVERHANG, z1 = Z1 + OVERHANG;
  const yB = SLAB_Y, c = CHAMFER;
  const topY = z => SLAB_TOP + SLAB_FALL * (z1 - z) / (z1 - z0);   // front edge high, back edge low
  const R0 = [[x0, topY(z0), z0], [x1, topY(z0), z0], [x1, topY(z1), z1], [x0, topY(z1), z1]];
  const R1 = [[x0, yB + c, z0], [x1, yB + c, z0], [x1, yB + c, z1], [x0, yB + c, z1]];
  const R2 = [[x0 + c, yB, z0 + c], [x1 - c, yB, z0 + c], [x1 - c, yB, z1 - c], [x0 + c, yB, z1 - c]];
  const pos = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), Hn = new THREE.Vector3();
  // Quad a-b-c-d, wound so its normal agrees with the hint.
  function quad(a, b, c2, d, hx, hy, hz) {
    A.fromArray(a); B.fromArray(b); C.fromArray(c2);
    N.subVectors(B, A).cross(C.clone().sub(A)); Hn.set(hx, hy, hz);
    const flip = N.dot(Hn) < 0;
    const tri = (p, q, s) => { if (flip) pos.push(...p, ...s, ...q); else pos.push(...p, ...q, ...s); };
    tri(a, b, c2); tri(a, c2, d);
  }
  quad(R0[0], R0[1], R0[2], R0[3], 0, 1, 0);
  quad(R2[0], R2[1], R2[2], R2[3], 0, -1, 0);
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    const mx = (R1[i][0] + R1[j][0]) / 2, mz = (R1[i][2] + R1[j][2]) / 2;   // edge midpoint -> outward hint
    quad(R0[i], R0[j], R1[j], R1[i], mx, 0, mz);
    quad(R1[i], R1[j], R2[j], R2[i], mx, -0.5, mz);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(pos.length / 3 * 2), 2));
  geo.computeVertexNormals();
  planarUV(geo, 4);
  return geo;
}

// Exploded, the parts step out through the reveal: frame first, then the leaf, then its handle.
function makeDoor(zOuter, s) {

  const span = (a, b) => [Math.min(zOuter + a * s, zOuter + b * s), Math.max(zOuter + a * s, zOuter + b * s)];
  const out = d => OUT(0, 0, -s * (WALL_OUT + d));   // clear of the wall's own push, then the reveal
  PART_TAG = s > 0 ? 0 : 1; PART_RUN = 0;
  const nextPart = () => { PART_RUN += 1; };   // frame, leaf, furniture, step — in that order
  const [f0, f1] = span(0.03, 0.13), fz = (f0 + f1) / 2;

  addPart(worldBox(DOOR_X0, DOOR_X1, DOOR_H - fw, DOOR_H, f0, f1, matFrame, 1), SHED_CX, DOOR_H - fw / 2, fz, out(0.8)); nextPart();
  const [l0, l1] = span(0.07, 0.11);
  addPart(worldBox(DOOR_X0 + fw, DOOR_X1 - fw, 0.02, DOOR_H - fw, l0, l1, matDoor, 1), SHED_CX, DOOR_H / 2, (l0 + l1) / 2, out(1.7)); nextPart();
  // Handle on the jamb away from the hinge; mirrored so both doors read correctly from outside.

          SHED_CX, (PAVE_Y - 0.02) / 2, (t0 + t1) / 2, out(0.3));   // threshold step
}

const CRANE = { x: -2.0, z: -6.2, h: 8.0, jib: 7.4, back: 2.2 };
CRANE.reach = Math.hypot(-CRANE.x, -CRANE.z);          // mast to the slab's centre

{
  const bar = (w, h, d, x, y, z, mat) => {

    m.position.set(x, y, z); m.castShadow = true;

  // Base and a four-post lattice mast with ties every metre.

  const a = 0.30;
  for (const sx of [-a, a]) for (const sz of [-a, a]) crane.add(bar(0.07, CRANE.h, 0.07, sx, CRANE.h / 2, sz));
  for (let y = 1; y < CRANE.h; y += 1.0) {
    crane.add(bar(2 * a, 0.05, 0.05, 0, y, -a)); crane.add(bar(2 * a, 0.05, 0.05, 0, y, a));
    crane.add(bar(0.05, 0.05, 2 * a, -a, y, 0)); crane.add(bar(0.05, 0.05, 2 * a, a, y, 0));

  // top chord tied back over a small A-frame — enough truss to read as a tower crane.
  craneJib.position.y = CRANE.h;

  craneJib.add(bar(CRANE.jib + CRANE.back, 0.12, 0.16, (CRANE.jib - CRANE.back) / 2, 0, 0));
  craneJib.add(bar(0.10, 1.10, 0.10, 0, 0.55, 0));
  for (let i = 1; i <= 6; i++) {
    const x = i * CRANE.jib / 6.5;
    craneJib.add(bar(0.05, 0.05 + 0.9 * (1 - i / 7), 0.05, x, (0.9 * (1 - i / 7)) / 2, 0));

// Put the hook at radius r along the jib with its underside at world height y, and
// pay the cable out to suit. Returns nothing; the load is positioned by the caller.
function craneHookTo(r, y) {
  const localY = y - crane.position.y - CRANE.h;
  craneHook.position.set(r, localY, 0);
  craneCable.position.set(r, localY / 2, 0);
  craneCable.scale.y = Math.max(Math.abs(localY), 0.01);
}

// Pinnate strip: bent, tapered outline; the leaflets come from the alpha-tested texture.
function frondGeometry(L, W, droop) {
  const segs = 9;
  const geo = new THREE.PlaneGeometry(L, W, segs, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = (p.getX(i) + L / 2) / L;
    const halfW = (W / 2) * Math.sin(Math.PI * Math.min(1, u * 0.85 + 0.15)) + 0.02;
    const side = Math.sign(p.getY(i)) || 1;
    p.setX(i, u * L);
    p.setY(i, -droop * u * u + Math.abs(p.getY(i)) * 0.12);
    p.setZ(i, side * halfW);
  }
  geo.computeVertexNormals();
  return geo;
}
// Banana paddle: oblong outline, folded along the midrib, drooping toward the tip.
function bananaLeafGeometry(L, W) {
  const geo = new THREE.PlaneGeometry(L, W, 14, 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = (p.getX(i) + L / 2) / L, s = p.getY(i) / (W / 2);
    const halfW = (W / 2) * Math.pow(Math.sin(Math.PI * (0.05 + u * 0.95)), 0.55);
    p.setX(i, u * L);
    p.setZ(i, s * halfW);
    p.setY(i, -0.45 * u * u * L - Math.abs(s) * 0.08);
  }
  geo.computeVertexNormals();
  return geo;
}
// Monstera: heart outline with deep marginal splits and a few fenestrations.
function monsteraGeometry() {
  const lobes = [[-0.10, 0.10, 0.40], [0.14, 0.30, 0.46], [0.34, 0.48, 0.44], [0.52, 0.64, 0.37], [0.68, 0.78, 0.28]]; // [y0, y1, xOuter]
  const right = [[0.10, -0.04], [0.24, -0.12]];
  lobes.forEach((lb, i) => {
    const y0 = lb[0], y1 = lb[1], xo = lb[2];
    right.push([xo * 0.82, y0], [xo, (y0 + y1) / 2], [xo * 0.82, y1]);
    if (i < lobes.length - 1) right.push([0.11, (y1 + lobes[i + 1][0]) / 2]);
  });
  right.push([0.15, 0.86], [0.06, 0.95]);
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.02);
  for (const pt of right) shape.lineTo(pt[0], pt[1]);
  shape.lineTo(0, 1.0);
  for (let i = right.length - 1; i >= 0; i--) shape.lineTo(-right[i][0], right[i][1]);
  shape.closePath();
  for (const h of [[0.17, 0.26, 0.055, 0.03], [-0.16, 0.44, 0.05, 0.028], [0.15, 0.58, 0.045, 0.025]]) {
    const path = new THREE.Path();
    path.absellipse(h[0], h[1], h[2], h[3], 0, Math.PI * 2, false, 0);
    shape.holes.push(path);
  }
  const geo = new THREE.ShapeGeometry(shape, 8);
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) + 0.5, (p.getY(i) + 0.15) / 1.2);
  geo.rotateX(-Math.PI / 2).rotateY(-Math.PI / 2);   // tip -> +x, face -> +y
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, -0.25 * z * z - 0.12 * x * x);          // edges and tip curl down
  }
  geo.computeVertexNormals();
  return geo;
}
// Fern: rosette of arched fronds merged into one geometry (instanced later).
function fernGeometry(seed) {
  const r = mulberry32(seed);
  const frond = new THREE.PlaneGeometry(1, 0.26, 8, 1);
  const p = frond.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + 0.5, w = p.getY(i);
    p.setX(i, u); p.setZ(i, w); p.setY(i, 0.55 * u * (1 - u) - 0.35 * u * u);
  }
  frond.computeVertexNormals();
  const list = [], m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), t = new THREE.Vector3();
  const n = 10;
  for (let i = 0; i < n; i++) {
    e.set(0, (i / n) * Math.PI * 2 + r() * 0.5, 0.35 + r() * 0.45, 'YXZ');
    q.setFromEuler(e);
    const sc = 0.75 + r() * 0.35;
    s.set(sc, sc, sc); t.set(0, 0.05, 0);
    m.compose(t, q, s);
    list.push(frond.clone().applyMatrix4(m));
  }
  return mergeGeos(list);
}
// Tall grass clump: 16 tapered, outward-leaning blades with a base-to-tip colour gradient.
function grassClumpGeometry(seed) {
  const r = mulberry32(seed), blades = 16, rows = 4;
  const pos = [], nor = [], col = [], idx = [];
  const cBase = new THREE.Color(0x4f7a26), cTip = new THREE.Color(0xb7cf58), c = new THREE.Color();
  for (let b = 0; b < blades; b++) {
    const az = r() * Math.PI * 2, h = 0.55 + r() * 0.45, lean = 0.25 + r() * 0.45, w0 = 0.035;
    const dx = Math.cos(az), dz = Math.sin(az), spread = 0.06 * r();
    const bx = dx * spread, bz = dz * spread;
    const base = pos.length / 3;
    for (let k = 0; k <= rows; k++) {
      const t = k / rows, out = lean * t * t * h, y = h * t * (1 - 0.3 * t * t), hw = w0 * (1 - t) + 0.003;
      const px = -dz * hw, pz = dx * hw;
      pos.push(bx + dx * out - px, y, bz + dz * out - pz, bx + dx * out + px, y, bz + dz * out + pz);
      c.lerpColors(cBase, cTip, t);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);

  }

  geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nor), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));

// Shrub blob: jittered sphere (jitter keyed on position so seam vertices stay welded), flat shaded.
function blobGeometry(seed) {
  const geo = new THREE.SphereGeometry(1, 9, 7);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const j = 0.82 + 0.3 * hash2(x * 7.1 + y * 3.3 + seed, z * 5.7 - y * 2.1);
    p.setXYZ(i, x * j, y * j * 0.8, z * j);
  }
  geo.computeVertexNormals();
  return geo;
}

function makePalm(x, z, seed, hScale) {
  const r = mulberry32(seed);
  const group = new THREE.Group();
  group.position.set(x, terrainHeight(x, z) - 0.05, z);
  const h = (3.8 + r() * 2.4) * hScale, segs = 6;   // crowns always clear the 3.24 m slab top
  const leanX = (r() - 0.5) * 0.5, leanZ = (r() - 0.5) * 0.5;
  let px = 0, py = 0, pz = 0;
  for (let i = 0; i < segs; i++) {
    const u = i / segs, len = h / segs;
    const geo = new THREE.CylinderGeometry(0.13 - u * 0.045, 0.145 - u * 0.045, len * 1.06, 9);
    const uv = geo.attributes.uv;
    for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * 2, uv.getY(k) * len);   // 1 ring tile per metre
    const seg = new THREE.Mesh(geo, matTrunk);
    const tx = leanX * u * u * 2, tz = leanZ * u * u * 2;
    seg.position.set(px + tx * len * 0.5, py + len * 0.5, pz + tz * len * 0.5);
    seg.rotation.z = -tx; seg.rotation.x = tz;
    seg.castShadow = true;
    group.add(seg);
    px += tx * len; py += len; pz += tz * len;
  }
  const crown = new THREE.Group();
  crown.position.set(px, py, pz);
  group.add(crown);
  const n = 10;
  for (let i = 0; i < n; i++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (i / n) * Math.PI * 2 + r() * 0.4;
    const m = new THREE.Mesh(palmFrondGeo, matPalmFrond);
    m.rotation.z = 0.3 + r() * 0.5;   // positive raises the tip; the geometry droops it back down
    m.castShadow = true;
    pivot.add(m); crown.add(pivot);
    sway(m, 'z', 0.04, 1.7, r() * 6.28);
  }
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(coconutGeo, matCoconut);
    c.position.set((r() - 0.5) * 0.3, -0.15, (r() - 0.5) * 0.3);
    crown.add(c);
  }
  sway(crown, 'z', 0.025, 0.9, r() * 6.28);
  sway(crown, 'x', 0.02, 0.7, r() * 6.28);
  garden.add(group);
}
function makeBanana(x, z, seed) {

  const h = 1.3 + r() * 0.8;

  stem.position.y = h / 2; stem.castShadow = true; group.add(stem);

function makeMonstera(x, z, seed) {

function makeShrub(x, z, seed, flowerMat) {

    const s = size * (0.45 + r() * 0.4);
    m.scale.set(s, s, s);
    m.position.set((r() - 0.5) * size * 0.9, s * 0.6 + r() * size * 0.3, (r() - 0.5) * size * 0.9);
    m.rotation.y = r() * 6.28;

    group.add(m);

      const f = new THREE.Mesh(flowerGeo, flowerMat);

const occupied = [];   // [x, z, r]
function isFree(x, z, r) {
  for (const k of KEEP) if (x > k[0] - r && x < k[1] + r && z > k[2] - r && z < k[3] + r) return false;
  for (const o of occupied) if (Math.hypot(o[0] - x, o[1] - z) < o[2] + r) return false;
  return true;
}
function placeIn(rect, n, r, fn) {
  let c = 0, tries = 0;
  while (c < n && tries++ < n * 80) {
    const x = lerp(rect[0], rect[1], rng()), z = lerp(rect[2], rect[3], rng());
    if (!isFree(x, z, r)) continue;
    occupied.push([x, z, r]);
    fn(x, z, c);
    c++;
  }
}

{

  const build = (geo, mat, xf) => {

const UP = new THREE.Vector3(0, 1, 0);

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r); g.lineTo(x + r, y + h);
  g.arcTo(x, y + h, x, y + h - r, r); g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath();
}
function labelSprite(value, name) {
  const cv = makeCanvas(256, 112), g = cv.getContext('2d');
  g.fillStyle = 'rgba(8,20,14,0.8)'; roundRect(g, 8, 8, 240, 96, 14); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#ffb45c'; g.font = '500 46px "IBM Plex Mono", Menlo, Consolas, monospace';
  g.fillText(value + ' m', 128, name ? 46 : 56);
  if (name) {
    g.fillStyle = 'rgba(233,241,239,0.78)'; g.font = '600 22px "Barlow Condensed", "Helvetica Neue", Arial, sans-serif';
    g.fillText(name.toUpperCase(), 128, 84);
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  sp.scale.set(1.15, 1.15 * 112 / 256, 1);
  sp.renderOrder = 10;
  return sp;
}
function dimLine(a, b, mat) { dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat)); }
function dimArrow(tip, dir) {
  const m = new THREE.Mesh(arrowGeo, matDimArrow);
  m.quaternion.setFromUnitVectors(UP, dir);
  m.position.copy(tip).addScaledVector(dir, -0.07);
  dims.add(m);
}
// a, b: measured points. off: from the measured points to the dimension line. labelOff: from the line midpoint.
function dimension(a, b, off, name, labelOff) {
  const a2 = a.clone().add(off), b2 = b.clone().add(off);
  dimLine(a2, b2, matDimLine);
  dimLine(a, a.clone().addScaledVector(off, 1.12), matDimWit);
  dimLine(b, b.clone().addScaledVector(off, 1.12), matDimWit);
  const d = b2.clone().sub(a2), len = d.length();
  d.normalize();
  dimArrow(b2, d);
  dimArrow(a2, d.clone().negate());
  const s = labelSprite(len.toFixed(2), name);
  s.position.copy(a2).lerp(b2, 0.5).add(labelOff || V(0, 0.24, 0));
  dims.add(s);
}

    const u = document.createElement('div'); u.className = 'u'; u.textContent = unit;
    grid.append(k, v, u);
    if (label === 'Sun') sunEl = v;
  }
  return sunEl;
})();

const bDim = document.getElementById('bDim'), bSun = document.getElementById('bSun'), bGhost = document.getElementById('bGhost');
const bExpl = document.getElementById('bExpl');
const sunValEl = document.getElementById('sunVal');
const subEl = document.getElementById('sub'), SUB_ASSEMBLED = subEl.textContent;
let ghost = false;
// Exploded view: exploded is the switch, explodeT the eased 0..1 the frame loop drives.
let exploded = false, explodeT = 0, explodeE = 0;
const bBuild = document.getElementById('bBuild'), buildValEl = document.getElementById('buildVal');
function toggleDims() {
  dims.visible = !dims.visible;
  bDim.classList.toggle('on', dims.visible);
  bDim.setAttribute('aria-pressed', String(dims.visible));
}
function cycleSun() {
  sunIdx = (sunIdx + 1) % SUN_PRESETS.length;
  sunValEl.textContent = SUN_PRESETS[sunIdx].name;
}
function toggleGhost() {
  if (buildOn) buildFinish();
  ghost = !ghost;
  matConcrete.transparent = ghost;
  matConcrete.opacity = ghost ? 0.28 : 1;
  matConcrete.depthWrite = !ghost;
  matConcrete.needsUpdate = true;
  slab.castShadow = !ghost;
  bGhost.classList.toggle('on', ghost);
  bGhost.setAttribute('aria-pressed', String(ghost));
}
function explodeOff() {
  exploded = false; explodeT = 0; explodeE = 0;
  bExpl.classList.remove('on'); bExpl.setAttribute('aria-pressed', 'false');
}
function toggleExplode() {
  if (buildOn) buildFinish();       // the two views are exclusive; finish the building first
  exploded = !exploded;
  // Back off far enough to see the whole spread, and give the zoom back on the way in.
  manual.radius = clamp(manual.radius * (exploded ? 1.8 : 1 / 1.8), 4, 40);
  subEl.textContent = exploded ? parts.length + ' parts · pulled apart' : SUB_ASSEMBLED;
  bExpl.classList.toggle('on', exploded);
  bExpl.setAttribute('aria-pressed', String(exploded));
}
bDim.addEventListener('click', toggleDims);
bSun.addEventListener('click', cycleSun);
bGhost.addEventListener('click', toggleGhost);
bExpl.addEventListener('click', toggleExplode);
bBuild.addEventListener('click', toggleBuild);
window.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd') toggleDims(); else if (k === 's') cycleSun();
  else if (k === 'g') toggleGhost(); else if (k === 'x') toggleExplode();
  else if (k === 'b') toggleBuild();
});


/* ---------------------------------------------------------------------------
 * Build sequence
 *
 * The site figure lays the building up part by part in the order it would really
 * be built: slab on grade, then course after course of blockwork with the lintels
 * dropped in as the openings top out, then the roof slab on the crane, then the
 * doors and the fittings. The mason climbs onto a trestle once a course goes
 * above comfortable laying height, so the sequence is watchable as instructions.
 * ------------------------------------------------------------------------- */
const BUILD_PHASE = { floor: 0, block: 1, lintel: 1, roof: 2, door: 3, fitting: 4 };
const BUILD_SECS  = { floor: 1.1, block: 0.14, lintel: 0.9, roof: 6.0, door: 0.55, fitting: 0.5 };
// What the figure carries in its own hands, as opposed to what is cast or craned in.
const HAND_LAID = { block: 1, lintel: 1, door: 1, fitting: 1 };
const CARRY = { fwd: 0.46, drop: 0.44 };   // where a carried piece sits, off the shoulders
const HOLD_U = 0.55;                     // held in the hands up to here, then set down
const BUILD_REACH = { floor: 0.5, block: 0.85, lintel: 1.1, roof: 0, door: 1.2, fitting: 0.8 };
const COURSES = Math.round(WALL_H / BLK_H);

// Trade by trade; inside the blockwork, course by course, wall by wall, along the wall.
// The lintel's own bottom edge sits between two courses, so it falls into place by itself.
const buildOrder = parts.map((p, i) => i).sort((a, b) => {
  const A = parts[a], B = parts[b];
  const phase = BUILD_PHASE[A.kind] - BUILD_PHASE[B.kind];
  if (phase) return phase;
  // Blockwork goes course by course; the other trades follow their own assembly order.
  if (BUILD_PHASE[A.kind] === 1 && Math.abs(A.y0 - B.y0) > 1e-4) return A.y0 - B.y0;
  if (A.tag !== B.tag) return A.tag - B.tag;
  return A.run - B.run;
});
// Where each part comes in from: back along the way it would fly out in the exploded
// view, so a block is set down from outside and above the wall it belongs to.
for (const p of parts) {
  const k = BUILD_REACH[p.kind];
  p.approach = p.expl.lengthSq() > 1e-6 ? p.expl.clone().normalize().multiplyScalar(k) : OUT(0, k, 0);
  p.homeOff = p.home.clone().sub(p.centre);   // put the piece's centre at X: position = X + homeOff
}

let buildOn = false, buildHold = false, buildIdx = 0, buildT = 0, buildLift = 0, buildNoteShown = '';
const hook = { r: 2.4, y: 0 };   // where the crane hook is, so it can hoist back up after the lift
let buildValShown = '';

function buildNote(p) {
  switch (p.kind) {
    case 'floor':  return 'Slab on grade · 150 mm on the prepared sub-base';
    case 'block':  return 'Course ' + Math.min(COURSES, Math.floor(p.y0 / BLK_H) + 1) + ' of ' + COURSES +
                          ' · Ytong 625 × 250 × 300, thin-bed, half-block bond';
    case 'lintel': return 'Lintel over the opening · 1400 long, 200 bearing each side';
    case 'roof':   return 'Roof slab by crane · one 200 mm RC pour over both bays';
    case 'door':   return 'Doors · frame set in the reveal, then leaf and handle';
    default:       return 'Rainwater goods and light fittings';
  }
}
function buildUI() {
  bBuild.classList.toggle('on', buildOn);
  const v = buildOn ? (buildHold ? 'Paused ' : '') + buildIdx + '/' + buildOrder.length : '';
  if (v !== buildValShown) buildValEl.textContent = buildValShown = v;
}
function buildStart() {
  explodeOff();
  buildOn = true; buildHold = false; buildIdx = 0; buildT = 0; buildNoteShown = '';
  for (const p of parts) { p.obj.visible = false; p.obj.position.copy(p.home); p.obj.updateMatrix(); }
  crane.visible = true;
  hook.r = 2.4; hook.y = crane.position.y + CRANE.h - 2.2;
  craneHookTo(hook.r, hook.y);
  buildUI();
}
function buildFinish() {
  buildOn = false; buildHold = false; buildIdx = buildOrder.length;
  for (const p of parts) { p.obj.visible = true; p.obj.position.copy(p.home); p.obj.updateMatrix(); }
  crane.visible = false; trestle.visible = false;
  figure.position.set(FIG.x, FIG.y, FIG.z); figure.rotation.y = FIG.yaw;
  for (const a of figArms) a.quaternion.copy(a.rest);
  figUpper.rotation.x = 0;
  subEl.textContent = exploded ? parts.length + ' parts · pulled apart' : SUB_ASSEMBLED;
  buildUI();
}
function toggleBuild() {
  if (!buildOn) buildStart();
  else { buildHold = !buildHold; buildUI(); }
}

// Trolley runs out along the jib with the slab held high, then the hoist lowers it home.
const cranePos = new THREE.Vector3();
function craneLift(p, u) {
  const r = lerp(2.4, CRANE.reach, smoothstep(0, 1, clamp(u / 0.45, 0, 1)));
  const drop = smoothstep(0, 1, clamp((u - 0.45) / 0.55, 0, 1));
  const y = lerp(crane.position.y + CRANE.h - 1.9, p.centre.y, drop);
  cranePos.set(CRANE.x + Math.cos(CRANE.yaw) * r, y, CRANE.z - Math.sin(CRANE.yaw) * r);
  p.obj.position.copy(cranePos).add(p.homeOff);
  p.obj.updateMatrix();
  hook.r = r; hook.y = y + SLAB_T / 2 + 0.12;
  craneHookTo(hook.r, hook.y);
}

const DOWN = new THREE.Vector3(0, -1, 0);
const _hand = new THREE.Vector3(), _aim = new THREE.Vector3(), _q = new THREE.Quaternion();
const _sh = new THREE.Vector3();

// Where a carried piece sits: off the shoulders, forward and down, so it lands just
// within arm's length of both of them — and it follows the trunk when the figure stoops.
function carryPoint(out) {
  figArms[0].getWorldPosition(out);
  figArms[1].getWorldPosition(_sh);
  out.add(_sh).multiplyScalar(0.5);
  out.x += Math.sin(figure.rotation.y) * CARRY.fwd;
  out.z += Math.cos(figure.rotation.y) * CARRY.fwd;
  out.y -= CARRY.drop;
  return out;
}
// Aim both arms at `target` (world), a hand either side of it; null lets them hang.
// Worked in each shoulder's own parent frame, so the trunk's stoop is already in it.
function siteArms(target, dt) {
  const k = damp(16, dt);
  for (let i = 0; i < figArms.length; i++) {
    const arm = figArms[i];
    if (target) {
      _aim.copy(target);
      arm.parent.worldToLocal(_aim);
      _aim.sub(arm.shoulder);
      _aim.x += i ? 0.16 : -0.16;              // a hand to each side of the piece
      if (_aim.lengthSq() < 1e-6) _aim.copy(DOWN);
      _q.setFromUnitVectors(DOWN, _aim.normalize());
    } else _q.copy(arm.rest);
    arm.quaternion.slerp(_q, k);
  }
}

// The mason stands on the side the part is placed from, on a trestle once the course
// is above comfortable laying height, and reaches up as the piece goes down.
function siteFollow(p, dt) {
  let tx, tz, deck = 0;
  if (p.kind === 'roof') {
    // Nobody stands under the load: the figure banks the lift in from the hardstanding.
    tx = CRANE.x + 1.3; tz = CRANE.z + 2.3;
  } else {
    let dx = p.expl.x, dz = p.expl.z;
    let l = Math.hypot(dx, dz);
    if (l < 0.2) { dx = FIG.x - p.centre.x; dz = FIG.z - p.centre.z; l = Math.hypot(dx, dz) || 1; }
    dx /= l; dz /= l;
    // Close enough that the piece is within arm's length, but clear of the wall face.
    tx = p.centre.x + dx * 0.70; tz = p.centre.z + dz * 0.70;
    // Trestle only for work laid by hand: 500 mm steps, chosen to bring the course
    // up to chest height rather than merely within reach.
    if (HAND_LAID[p.kind]) {
      const ground0 = terrainHeight(tx, tz);
      deck = clamp(Math.round((p.centre.y - 1.38 - ground0) / 0.5) * 0.5, 0, 2.0);
    }
  }
  const ground = terrainHeight(tx, tz);
  const k = damp(8, dt);
  figure.position.x += (tx - figure.position.x) * k;
  figure.position.z += (tz - figure.position.z) * k;
  figure.position.y += (ground + deck - figure.position.y) * k;
  let turn = Math.atan2(p.centre.x - figure.position.x, p.centre.z - figure.position.z) - figure.rotation.y;
  while (turn > Math.PI) turn -= 2 * Math.PI;
  while (turn < -Math.PI) turn += 2 * Math.PI;
  figure.rotation.y += turn * k;
  // Stoop toward anything below chest height; upright once the trestle has raised the
  // work. The bottom courses need the trunk almost horizontal, which is how they are laid.
  const stoop = clamp((figure.position.y + 1.30 - p.centre.y) / 0.9, 0, 1) * 1.45;
  figUpper.rotation.x += (stoop - figUpper.rotation.x) * k;
  figure.updateMatrixWorld(true);
  trestle.visible = deck > 0;
  if (deck > 0) {
    trestle.position.set(figure.position.x, ground + deck, figure.position.z);
    trestle.rotation.y = figure.rotation.y;
    for (const c of trestle.children) if (c.name === 'leg') { c.scale.y = deck; c.position.y = -deck / 2; }
  }
}

function buildFrame(dt) {
  if (!buildOn) return;
  if (!buildHold) buildT += dt;
  // Settle every part whose time is up; a slow frame may cover several blocks.
  let guard = 0;
  while (buildIdx < buildOrder.length && guard++ < 400) {
    const p = parts[buildOrder[buildIdx]];
    if (buildT < BUILD_SECS[p.kind]) break;
    buildT -= BUILD_SECS[p.kind];
    p.obj.visible = true; p.obj.position.copy(p.home); p.obj.updateMatrix();
    buildIdx++;
  }
  if (buildIdx >= buildOrder.length) { buildFinish(); return; }
  const p = parts[buildOrder[buildIdx]];
  const u = smoothstep(0, 1, clamp(buildT / BUILD_SECS[p.kind], 0, 1));
  p.obj.visible = true;
  siteFollow(p, dt);           // walk and climb first, so the hands are where they will be
  if (p.kind === 'roof') { craneLift(p, u); siteArms(null, dt); }
  else {
    if (HAND_LAID[p.kind]) {
      // Held in both hands, then set down: the piece leaves the chest only at HOLD_U.
      carryPoint(_hand);
      const place = clamp((u - HOLD_U) / (1 - HOLD_U), 0, 1);
      _hand.lerp(p.centre, place);
      p.obj.position.copy(_hand).add(p.homeOff);
      siteArms(_hand, dt);
    } else {
      p.obj.position.copy(p.home).addScaledVector(p.approach, 1 - u);
      siteArms(null, dt);
    }
    p.obj.updateMatrix();
    const k = damp(1.6, dt);   // hoist back up to the parked position between lifts
    hook.r += (2.4 - hook.r) * k;
    hook.y += (crane.position.y + CRANE.h - 2.2 - hook.y) * k;
    craneHookTo(hook.r, hook.y);
  }
  const note = buildNote(p);
  if (note !== buildNoteShown) { subEl.textContent = buildNoteShown = note; }
  buildUI();
}

/* ---------------------------------------------------------------------------
 * Camera: hero three-quarter view with a slow drift, blended with manual orbit
 * ------------------------------------------------------------------------- */
const TARGET = new THREE.Vector3(0.2, 1.35, -0.2);
const TARGET_Y = TARGET.y;
const HERO = { theta: 2.46, phi: 1.30, radius: 13.0 };   // from the south-east: shed on the left, carport opening and slab edge running right
const manual = { weight: 0, theta: 0, phi: 1.1, radius: 13, lastInput: -1e9, dragging: false, lx: 0, ly: 0 };
const hintEl = document.getElementById('hint'), dotEl = document.getElementById('dot');
function beginManual() {
  if (manual.weight < 0.5) {
    const off = camera.position.clone().sub(TARGET);
    manual.radius = Math.max(off.length(), 4);
    manual.theta = Math.atan2(off.x, off.z);
    manual.phi = Math.acos(clamp(off.y / manual.radius, -1, 1));
  }
  manual.lastInput = time;
}
canvas.addEventListener('pointerdown', e => {
  beginManual(); manual.dragging = true; manual.lx = e.clientX; manual.ly = e.clientY;
  canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!manual.dragging) return;
  manual.theta -= (e.clientX - manual.lx) * 0.005;
  manual.phi = clamp(manual.phi - (e.clientY - manual.ly) * 0.005, 0.1, 1.52);
  manual.lx = e.clientX; manual.ly = e.clientY; manual.lastInput = time;
});
const endDrag = () => { manual.dragging = false; manual.lastInput = time; canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); beginManual();
  manual.radius = clamp(manual.radius * (1 + e.deltaY * 0.001), 4, 40);
}, { passive: false });

/* ---------------------------------------------------------------------------
 * Frame loop
 * ------------------------------------------------------------------------- */
const clock = new THREE.Clock();
let time = 0, first = true, hudAcc = 0;
const camAuto = new THREE.Vector3(), camManual = new THREE.Vector3(), camFinal = new THREE.Vector3();
const skyHorizon = skyMat.uniforms.uHorizon.value;
function orbitPos(out, theta, phi, radius) {
  const sp = Math.sin(phi);
  out.set(TARGET.x + radius * sp * Math.sin(theta), TARGET.y + radius * Math.cos(phi), TARGET.z + radius * sp * Math.cos(theta));
  out.y = Math.max(out.y, GROUND_Y + 0.4);   // never below the garden
  return out;
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  time += dt;

  // --- sun: tween toward the selected preset ---
  const P = SUN_PRESETS[sunIdx];
  const k = first ? 1 : damp(2.5, dt);
  sunDir.lerp(P.dir, k).normalize();
  sun.color.lerp(P.color, k);
  sun.intensity = lerp(sun.intensity, P.intensity, k);
  hemi.intensity = lerp(hemi.intensity, P.hemi, k);
  skyHorizon.lerp(P.horizon, k);
  scene.fog.color.copy(skyHorizon);
  renderer.setClearColor(skyHorizon);
  placeSun();
  skyMat.uniforms.uSunDir.value.copy(sunDir);

  // --- breeze: every registered pivot rocks on two incommensurate sines ---
  if (!reducedMotion) {
    for (let i = 0; i < swayers.length; i++) {
      const s = swayers[i];
      s.obj.rotation[s.axis] = s.base + s.amp * (Math.sin(time * s.freq + s.phase) + 0.5 * Math.sin(time * s.freq * 2.31 + s.phase * 1.7));
    }
  }

  // --- exploded view: each part slides along the offset stored when it was built ---
  const explWant = exploded ? 1 : 0;
  if (explodeT !== explWant) {
    explodeT += (explWant - explodeT) * (reducedMotion ? 1 : damp(2.4, dt));
    if (Math.abs(explWant - explodeT) < 5e-4) explodeT = explWant;
    explodeE = smoothstep(0, 1, explodeT);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.obj.position.copy(p.home).addScaledVector(p.expl, explodeE);
      p.obj.updateMatrix();
    }
  }

  // --- build sequence: the site figure lays the next part ---
  buildFrame(dt);
  // Rise to take in the crane while the roof slab is flying.
  const wantLift = buildOn && parts[buildOrder[Math.min(buildIdx, buildOrder.length - 1)]].kind === 'roof' ? 1 : 0;
  buildLift += (wantLift - buildLift) * damp(1.6, dt);

  // --- camera: drifting hero orbit, blended with manual orbit; manual releases after 5 s idle ---
  const drift = reducedMotion ? 0 : 1;
  TARGET.y = TARGET_Y + 2.0 * explodeE + 1.5 * buildLift;   // the spread, and the lift, are taller than the building
  orbitPos(camAuto,
    HERO.theta + drift * 0.09 * Math.sin(time * 2 * Math.PI / 41),
    HERO.phi + drift * 0.025 * Math.sin(time * 2 * Math.PI / 57 + 1),
    HERO.radius * (1 + 0.8 * explodeE + 0.3 * buildLift) + drift * 0.6 * Math.sin(time * 2 * Math.PI / 47 + 2));
  const wantManual = manual.dragging || (time - manual.lastInput) < 5;
  manual.weight += ((wantManual ? 1 : 0) - manual.weight) * damp(3, dt);
  if (manual.weight > 0.001) {
    orbitPos(camManual, manual.theta, manual.phi, manual.radius);
    camFinal.lerpVectors(camAuto, camManual, manual.weight);
  } else camFinal.copy(camAuto);
  camera.position.copy(camFinal);
  camera.lookAt(TARGET);
  hintEl.classList.toggle('manual', manual.weight > 0.5);
  dotEl.classList.toggle('off', manual.weight > 0.5);

  // --- HUD: sun azimuth / elevation at 10 Hz ---
  hudAcc += dt;
  if (hudAcc > 0.1 || first) {
    hudAcc = 0;
    const az = ((Math.atan2(sunDir.x, sunDir.z) * 180 / Math.PI) % 360 + 360) % 360;   // 0 = north (+z), 90 = east (+x)
    const el = Math.asin(clamp(sunDir.y, -1, 1)) * 180 / Math.PI;
    sunRowEl.textContent = String(Math.round(az)).padStart(3, '0') + '° / ' + String(Math.round(el)).padStart(2, '0') + '°';
  }

  first = false;
  renderer.render(scene, camera);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
onResize();
frame();
})();
</script>
</body>
</html>
